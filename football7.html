<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7v7 Lineup</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#1c2420;--muted:#5d6b63;--line:#d8ded9;--a:#d6453d;--b:#2f6fd6;--grass:#3f9a4f;--grass2:#378a46}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1c221f;--ink:#e8eee9;--muted:#9aa8a0;--line:#2d3632}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
header{padding:14px 16px;font-weight:700;font-size:20px}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:0 16px 24px;max-width:1100px;margin:auto}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h3{margin:0 0 8px;font-size:15px}
textarea,select,input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{height:150px;resize:vertical}
button{padding:8px 12px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;margin-top:8px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.pitch{position:relative;width:100%;aspect-ratio:2/3;max-height:80vh;margin:auto;border-radius:10px;overflow:hidden;
 background:repeating-linear-gradient(0deg,var(--grass) 0 8.33%,var(--grass2) 8.33% 16.66%);touch-action:none}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.p{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none}
.p .dot{width:34px;height:34px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;box-shadow:0 2px 4px #0005}
.p .nm{margin-top:2px;background:#000a;color:#fff;font-size:11px;padding:1px 6px;border-radius:6px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.A .dot{background:var(--a)}.B .dot{background:var(--b)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:13px}
.teams ol{margin:4px 0 0;padding-left:18px}
.tA{color:var(--a);font-weight:700}.tB{color:var(--b);font-weight:700}
</style>
</head>
<body>
<header>⚽ 7v7 Football Lineup</header>
<div class="wrap">
 <div class="card">
  <h3>1. Players (one per line)</h3>
  <textarea id="names" placeholder="Name&#10;Name&#10;..."></textarea>
  <p class="hint">Add up to 14 names. First name of each team plays goalkeeper.</p>
  <div class="row"><button id="shuffle">🔀 Random teams</button><button class="ghost" id="order">In order</button></div>
  <h3 style="margin-top:14px">2. Formation</h3>
  <div class="row">
   <div><span class="tA">Red</span><select id="fA"></select></div>
   <div><span class="tB">Blue</span><select id="fB"></select></div>
  </div>
  <button class="ghost" id="reset">↺ Reset positions</button>
  <p class="hint">3. Drag players on the pitch to place them. Saved automatically.</p>
  <div class="teams" id="lists"></div>
 </div>
 <div class="card"><div class="pitch" id="pitch">
  <svg viewBox="0 0 200 300" preserveAspectRatio="none" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.2">
   <rect x="6" y="6" width="188" height="288"/><line x1="6" y1="150" x2="194" y2="150"/>
   <circle cx="100" cy="150" r="24"/><circle cx="100" cy="150" r="1.5" fill="#fff"/>
   <rect x="50" y="6" width="100" height="40"/><rect x="50" y="254" width="100" height="40"/>
   <rect x="80" y="2" width="40" height="4"/><rect x="80" y="294" width="40" height="4"/>
  </svg>
 </div></div>
</div>
<script>
// Formations: outfield rows from defence to attack (6 outfield + GK)
const F={"2-3-1":[[2],[3],[1]],"3-2-1":[[3],[2],[1]],"2-1-2-1":[[2],[1],[2],[1]],"3-1-2":[[3],[1],[2]],"2-2-2":[[2],[2],[2]],"1-3-2":[[1],[3],[2]]};
const $=id=>document.getElementById(id);
let S={names:"",A:[],B:[],fA:"2-3-1",fB:"3-2-1",pos:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("f7")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("f7",JSON.stringify(S))}catch(e){}};

for(const k in F){$("fA").add(new Option(k,k));$("fB").add(new Option(k,k))}
$("fA").value=S.fA;$("fB").value=S.fB;$("names").value=S.names;

function layout(form,team){ // returns 7 [x,y] in % ; team A bottom half, B top half
 const rows=F[form].map(r=>r[0]),pts=[[50,94]];
 rows.forEach((n,i)=>{const y=82-(i*(34/(rows.length-1||1)));for(let j=0;j<n;j++)pts.push([(j+1)*100/(n+1),y])});
 return team==="A"?pts:pts.map(([x,y])=>[100-x,100-y]);
}
function names(){return $("names").value.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,14)}
function split(shuffle){
 let n=names();if(shuffle)n=n.sort(()=>Math.random()-.5);
 S.A=n.filter((_,i)=>i%2==0);S.B=n.filter((_,i)=>i%2==1);S.pos={};render();
}
function render(){
 S.names=$("names").value;S.fA=$("fA").value;S.fB=$("fB").value;save();
 const pitch=$("pitch");pitch.querySelectorAll(".p").forEach(e=>e.remove());
 ["A","B"].forEach(t=>{
  const def=layout(S["f"+t],t);
  for(let i=0;i<7;i++){
   const key=t+i,[x,y]=S.pos[key]||def[i];
   const el=document.createElement("div");el.className="p "+t;el.style.left=x+"%";el.style.top=y+"%";
   el.innerHTML=`<div class="dot">${i==0?"GK":i}</div><div class="nm">${(S[t][i]||(t=="A"?"Red ":"Blue ")+(i+1)).replace(/</g,"&lt;")}</div>`;
   drag(el,key);pitch.appendChild(el);
  }
 });
 const li=t=>`<div><span class="t${t}">${t=="A"?"Red":"Blue"} (${S[t].length}/7)</span><ol>${S[t].slice(0,7).map((n,i)=>`<li>${n.replace(/</g,"&lt;")}${i==0?" 🧤":""}</li>`).join("")}</ol></div>`;
 $("lists").innerHTML=li("A")+li("B");
}
function drag(el,key){
 el.onpointerdown=e=>{
  el.setPointerCapture(e.pointerId);const r=$("pitch").getBoundingClientRect();
  el.onpointermove=m=>{const x=Math.min(98,Math.max(2,(m.clientX-r.left)/r.width*100)),y=Math.min(98,Math.max(2,(m.clientY-r.top)/r.height*100));
   el.style.left=x+"%";el.style.top=y+"%";S.pos[key]=[x,y]};
  el.onpointerup=()=>{el.onpointermove=null;save()};
 };
}
$("shuffle").onclick=()=>split(true);$("order").onclick=()=>split(false);
$("reset").onclick=()=>{S.pos={};render()};
$("fA").onchange=()=>{for(let i=0;i<7;i++)delete S.pos["A"+i];render()};
$("fB").onchange=()=>{for(let i=0;i<7;i++)delete S.pos["B"+i];render()};
$("names").oninput=()=>{S.names=$("names").value;save()};
render();
</script>
</body>
</html>
